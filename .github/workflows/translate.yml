name: Translate

on:
  repository_dispatch:
    types: [openlibrary-pot-updated]
  workflow_dispatch:
    inputs:
      language:
        description: "Debug: run for a single language only"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.get-batches.outputs.batches }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install babel pytest

      - name: Pull and sync all languages
        run: ./i18n pull --sync

      - name: Show incomplete languages
        run: ./i18n incomplete

      - name: Compute batches
        id: get-batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.language }}" ]; then
            # Manual single-language debug run bypasses the serialize gate.
            BATCHES='[["${{ inputs.language }}"]]'
          else
            # Serialize across runs. The per-language PRs from ONE run all carry
            # the same messages.pot snapshot and merge cleanly; but a PR left open
            # from an EARLIER run carries a different snapshot, so starting a new
            # run on top of it reintroduces the pairwise messages.pot conflict
            # that jammed auto-merge (#151). So: if any i18n/ai-* PR is still
            # open, do nothing this run and let the open ones land first. A read-
            # only `gh pr list` with github.token triggers no workflows.
            OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("i18n/ai-"))] | length' \
              2>/dev/null || true)
            if ! printf '%s' "$OPEN" | grep -qE '^[0-9]+$'; then
              # Fail CLOSED: if we cannot determine the open-PR count, skip this
              # run rather than translate and risk stacking a divergent
              # messages.pot on top of PRs we could not see (#151).
              echo "::warning::could not read open i18n/ai-* PR count (got '$OPEN'); skipping this run to stay safe."
              BATCHES='[]'
            elif [ "$OPEN" -gt 0 ]; then
              echo "::notice::$OPEN open i18n/ai-* PR(s) pending; skipping this run until they land (serialize, #151)."
              BATCHES='[]'
            else
              BATCHES=$(./i18n batch | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['batches']))")
            fi
          fi
          echo "batches=$BATCHES" >> $GITHUB_OUTPUT
          echo "Batches: $BATCHES"

      - name: Upload synced locale files
        uses: actions/upload-artifact@v4
        with:
          name: synced-locale
          path: |
            locale/
            messages.pot

  translate:
    needs: plan
    if: needs.plan.outputs.batches != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
      fail-fast: false
      # One PR per language can fan a single run out to ~1 agent per incomplete
      # language (~24 after a large messages.pot update). Each shard is a full
      # claude-code-action run against a shared API token, and the fleet has hit
      # token exhaustion before, so cap concurrency to pace the fan-out. This
      # stays effectively one-PR-per-language -- the cap only queues the shards,
      # it does not group languages.
      max-parallel: 4
    steps:
      - uses: actions/checkout@v4
        with:
          # Persist OL_BOT_PAT -- NOT the default GITHUB_TOKEN -- as the git
          # credential, so the translation agent's `git push` is authenticated
          # as the PAT. Pushes made with GITHUB_TOKEN spawn no new workflow runs
          # (documented GitHub behavior), so validate-pr / bake-regression never
          # fired on bot-pushed PRs and `gh pr merge` then waited forever on
          # checks that never arrived (#151: e.g. #131 had 0 checks, committer
          # github-actions[bot]). A PAT push triggers the `pull_request` checks
          # the merge gate below requires. `repo` scope suffices -- translation
          # branches never touch .github/workflows, so no `workflow` scope needed.
          token: ${{ secrets.OL_BOT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install babel pytest

      - name: Download synced locale files
        uses: actions/download-artifact@v4
        with:
          name: synced-locale

      - name: Translate batch
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.OL_BOT_PAT }}
        with:
          prompt: "@i18n-translation-instructions.md\n\nYour batch: ${{ toJSON(matrix.batch) }}"
          # Pin the model. claude-code-action@v1 has no `model` input, so the id
          # goes through claude_args (passed straight to the claude CLI). Without
          # a pin the CLI default drifted to `claude-sonnet-5-5`, which returned
          # 404 model_not_found in this pipeline's runs from 2026-09-28 on (e.g.
          # run 36623332913: "may not exist or you may not have access to it"),
          # so none completed. The last completing run (36095667073, 2026-09-25)
          # used `claude-sonnet-5`; pin that known-good id so a default change
          # cannot silently break or alter the pipeline.
          claude_args: "--max-turns 750 --permission-mode bypassPermissions --model claude-sonnet-5"
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.OL_BOT_CLAUDE_OAUTH_TOKEN }}
          github_token: ${{ secrets.OL_BOT_PAT }}

  merge:
    # Merge green translation PRs. This runs as its OWN job, after translate,
    # with `if: always()` so it ALSO runs on a serialized no-op run (when plan
    # emitted no batches because i18n/ai-* PRs are still open) and on a run where
    # translate failed. The merge sweep used to be a step inside translate, but
    # the serialize gate (#151) skips translate whenever a PR is open -- which
    # would leave a PR that went green *after* its own run's bounded poll with
    # nothing to ever merge it, wedging the pipeline until a human stepped in.
    # As its own always-on job it sweeps pending green PRs on every dispatch,
    # which is also what clears the serialize gate for the next run.
    needs: translate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge translation PRs that pass required checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This repo has allow_auto_merge:false and main has no branch
          # protection, so nothing but this gate stops unreviewed machine output
          # from landing. Merge a PR ONLY once both required checks -- validate
          # (validate-pr.yml) and bake-regression -- have actually passed; a
          # failing, pending, skipped or absent check never merges. There is no
          # blind fallback (the old `--auto || plain-merge` could merge unchecked
          # since --auto is disabled here). scripts/merge_gate.py makes the
          # pass/no-pass decision and is unit-tested in tests/test_merge_gate.py.
          gh pr list \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("i18n/ai-")) | .number' \
          | while IFS= read -r pr; do
              echo "::group::PR #$pr"
              # The checks run on the PR, not in this job, and may still be
              # starting when we get here. Poll (bounded) until a verdict exists:
              # `--watch` waits out checks that are *registered* and still
              # running; `--mode settled` tells "not reported yet / still
              # pending" (keep waiting) from "finished but not all passing"
              # (stop now, leave the PR open). A PR whose checks never register
              # is simply left for a later dispatch -- never merged unchecked.
              for _ in $(seq 1 20); do
                gh pr checks "$pr" --watch --interval 30 >/dev/null 2>&1 || true
                checks="$(gh pr checks "$pr" --json name,bucket 2>/dev/null || echo '[]')"
                if printf '%s' "$checks" \
                     | python3 scripts/merge_gate.py --require validate --require bake-regression; then
                  # Another iteration/run may have merged already; tolerate that
                  # without aborting (set -e).
                  gh pr merge "$pr" --squash --delete-branch \
                    || echo "note: merge of PR #$pr did not complete (already merged, or its state changed)"
                  break
                fi
                if printf '%s' "$checks" \
                     | python3 scripts/merge_gate.py --mode settled --require validate --require bake-regression; then
                  echo "Leaving PR #$pr open: its required checks finished but did not all pass."
                  break
                fi
                echo "Waiting for required checks on PR #$pr to register/complete..."
                sleep 30
              done
              echo "::endgroup::"
            done
